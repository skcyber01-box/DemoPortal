<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนที่ใบรับรองแพทย์ · MOPH Certificate (Demo Map V.1)</title>
<meta name="description" content="ต้นแบบระบบแผนที่สถานพยาบาลที่ออกใบรับรองแพทย์ดิจิทัล MOPH Certificate">
<meta name="theme-color" content="#0B6E69">
<script>/* ให้อยู่ใน scope ของแอป (จำเป็นต่อการติดตั้ง) */if(location.pathname==='/demos/moph-cert-map'||location.pathname==='/demos/moph-cert-map/'){location.replace('/demos/moph-cert-map/index.html'+location.search+location.hash)}</script>
<link rel="manifest" href="/demos/moph-cert-map/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/demos/moph-cert-map/favicon-32.png">
<link rel="apple-touch-icon" href="/demos/moph-cert-map/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="แผนที่ใบรับรอง">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --ink:#10282A; --muted:#4F6264; --line:#E1E6E4; --bg:#F5F7F6; --brand:#0B6E69; --brand-d:#084F4B; --brand-l:#E1F0EF;
    --ok:#0B5E3C; --ok-bg:#E3F3EA; --off:#3F4A4E; --off-bg:#ECEFF0; --bad:#9B1C1C; --bad-bg:#FDECEC;
    --sheet:40vh;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--brand)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  svg{flex-shrink:0}

  /* Header */
  header{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:1000;position:relative}
  .hwrap{display:flex;flex-direction:column;gap:10px;padding:10px 16px 12px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--brand);display:flex;align-items:center;justify-content:center}
  .bt{display:flex;flex-direction:column;flex:1;min-width:0}
  .bt b{font-size:15px}
  .bt span{font-size:11px;color:var(--muted)}
  .demo{font-size:10px;font-weight:700;letter-spacing:.04em;background:#FFF3CD;color:#6B4B00;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
  .btn{height:44px;padding:0 14px;border-radius:10px;border:1px solid #CBD5D2;background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;white-space:nowrap}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn.out{border-color:var(--brand);color:var(--brand);font-weight:600}
  .btn.on{background:var(--brand-l);border-color:var(--brand);color:var(--brand-d);font-weight:600}
  .srow{display:flex;gap:8px}
  .search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;border:1px solid #CBD5D2;border-radius:10px;background:#F9FBFA}
  .search input{border:none;background:transparent;outline:none;flex:1;min-width:0;font-size:15px}
  .search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,110,105,.15)}
  .icon-btn{width:36px;height:36px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:8px}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid #CBD5D2;background:#fff;font-size:13px;white-space:nowrap}
  .intent{display:none;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:10px;background:var(--brand-l);color:var(--brand-d);font-size:13px;line-height:1.5}
  .intent.show{display:flex}
  .user{display:none;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--brand-d);background:var(--brand-l);height:40px;padding:0 12px;border-radius:10px}
  body.logged .user{display:flex} body.logged #loginBtn{display:none}

  /* Main */
  main{position:relative;flex:1;min-height:0}
  #map{position:absolute;inset:0;background:#E4ECE7}
  .panel{position:absolute;left:0;right:0;bottom:0;height:var(--sheet);background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.12);z-index:900;display:flex;flex-direction:column;transition:height .25s ease}
  main.detail{--sheet:62vh}
  main.expanded{--sheet:78vh}
  .handle{align-self:center;width:44px;height:20px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .handle span{width:40px;height:4px;border-radius:2px;background:#CBD5D2}
  .pbody{flex:1;min-height:0;overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
  .float{position:absolute;z-index:800}
  .here{left:50%;transform:translateX(-50%);top:12px;display:none;height:42px;padding:0 16px;border-radius:21px;border:none;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.25);align-items:center;gap:6px;white-space:nowrap}
  .here.show{display:flex}
  .ctrls{right:12px;bottom:calc(var(--sheet) + 12px);display:flex;gap:8px;transition:bottom .25s ease}
  .fab{height:44px;min-width:44px;padding:0 14px;border-radius:22px;border:none;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;color:var(--brand)}
  .fab.sq{padding:0;color:var(--ink)}
  .legend{right:12px;bottom:calc(var(--sheet) + 66px);width:236px;padding:12px;border-radius:12px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.18);display:none;flex-direction:column;gap:7px;font-size:13px}
  .legend.show{display:flex}
  .legend b{font-size:13px}
  .li{display:flex;align-items:center;gap:8px}
  .hr{height:1px;background:var(--line)}

  /* List */
  .rhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:2px}
  .rhead b{font-size:15px}
  .rhead span{font-size:11px;color:var(--muted);white-space:nowrap}
  .item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left;width:100%}
  .item:hover{border-color:#B9C7C3;background:#FBFCFC}
  .lv{min-width:32px;height:32px;padding:0 4px;border-radius:32px;color:#fff;font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .lv.lg{min-width:46px;height:46px;font-size:15px}
  .lv.sm{min-width:22px;height:22px;font-size:10px}
  .lv.inact{background:#fff!important;border:2px dashed currentColor}
  .itxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .itxt b{font-size:14px;font-weight:600}
  .itxt span{font-size:12px;color:var(--muted)}
  .iside{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .iside b{font-size:13px}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:9px;white-space:nowrap}
  .t-open{background:var(--ok-bg);color:var(--ok)} .t-closed{background:var(--off-bg);color:var(--off)}
  .t-act{background:var(--ok-bg);color:var(--ok)} .t-inact{background:var(--bad-bg);color:var(--bad)}
  .empty{padding:16px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.6;color:#3E5254}

  /* Detail */
  .dtop{display:flex;gap:12px;align-items:flex-start}
  .dtop h2{margin:0;font-size:18px;line-height:1.35}
  .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
  .closeb{width:44px;height:44px;border-radius:22px;border:none;background:#F0F3F2;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .obox{padding:12px;border-radius:12px;display:flex;flex-direction:column;gap:4px}
  .obox b{font-size:14px}
  .obox span{font-size:13px;line-height:1.6}
  .sec{display:flex;flex-direction:column;gap:8px}
  .sec>b{font-size:13px}
  .cwrap{display:flex;flex-wrap:wrap;gap:6px}
  .cert{font-size:12px;padding:4px 10px;border-radius:12px;background:var(--brand-l);color:var(--brand-d)}
  .cert.hit{background:var(--brand);color:#fff;font-weight:600}
  .row{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55;color:#3E5254}
  .call{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border-radius:10px;background:var(--bg);text-decoration:none;color:var(--ink);font-size:14px}
  .call b{margin-left:auto;color:var(--brand)}
  .acts{display:flex;gap:10px;position:sticky;bottom:0;background:#fff;padding-top:8px}
  .acts .btn{flex:1;height:48px}

  /* Pins */
  .pin-wrap{background:transparent;border:none}
  .pin{position:relative;width:36px;height:46px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%;transition:transform .15s}
  .pin .c{position:relative;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3);font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
  .pin.inact .c{background:#fff!important;border:2.5px dashed currentColor}
  .pin .s{width:3px;height:10px;border-radius:0 0 2px 2px}
  .pin .d{position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;border:2px solid #fff}
  .pin.sel{transform:scale(1.3)}
  .me{width:20px;height:20px;border-radius:50%;background:#2F6FDB;border:3px solid #fff;box-shadow:0 0 0 10px rgba(47,111,219,.2)}

  /* Modal */
  .modal{position:fixed;inset:0;z-index:2000;display:none}
  .modal.show{display:block}
  .scrim{position:absolute;inset:0;background:rgba(16,40,42,.45)}
  .dlg{position:absolute;left:0;right:0;bottom:0;max-height:88vh;background:#fff;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
  .dhead{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 4px}
  .dhead b{font-size:18px}
  .dbody{overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;gap:18px}
  .dfoot{display:flex;gap:10px;padding:12px 20px 20px;border-top:1px solid var(--line)}
  .dfoot .btn{flex:1;height:48px}
  .dfoot .btn.pri{flex:2}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid #CBD5D2;background:#fff;font-size:14px;display:inline-flex;align-items:center;gap:6px}
  .opt[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .opt.lvopt[aria-pressed="true"]{background:var(--brand-l);color:var(--brand-d)}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid3 .opt{justify-content:center}
  .chk{display:flex;align-items:center;gap:10px;font-size:14px;min-height:44px}
  .chk input{width:20px;height:20px;accent-color:var(--brand)}
  .hint{font-weight:400;color:var(--muted)}

  /* Auth screens */
  .auth{max-width:440px;margin:0 auto;width:100%}
  .auth h1{margin:0;font-size:24px;line-height:1.35}
  .auth p{margin:0;font-size:14px;line-height:1.65;color:#3E5254}
  .benefit{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.55}
  .note{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--bg);font-size:13px;line-height:1.6;color:#3E5254}
  .cons{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;border:1px solid #CBD5D2}
  .cons.req{border-color:var(--brand);background:#F2F8F7}
  .cons input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--brand);flex-shrink:0}
  .cons b{font-size:14px;display:block}
  .cons span{font-size:12px;line-height:1.5;color:var(--muted)}
  .spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--brand-l);border-top-color:var(--brand);animation:sp 1s linear infinite;align-self:center}
  @keyframes sp{to{transform:rotate(360deg)}}

  .toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);max-width:calc(100% - 48px);padding:12px 16px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px;line-height:1.5;text-align:center;z-index:3000;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .leaflet-control-attribution{font-size:10px}
  .leaflet-top.leaflet-right{top:60px}

  /* Desktop */
  @media (min-width: 900px){
    .hwrap{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 20px}
    .brand{flex:0 0 auto}
    .srow{flex:1 1 420px;max-width:640px}
    .chips,.intent{flex:1 1 100%}
    .hright{margin-left:auto}
    main{--sheet:0px}
    main.detail,main.expanded{--sheet:0px}
    .panel{top:0;bottom:0;right:auto;width:400px;height:auto;border-radius:0;box-shadow:2px 0 10px rgba(0,0,0,.06)}
    .handle{display:none}
    .pbody{padding:16px}
    #map{left:400px}
    .here{left:calc(50% + 200px)}
    .ctrls{bottom:24px;right:16px}
    .legend{bottom:78px;right:16px}
    .dlg{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:560px;border-radius:20px}
    .toast{top:96px}
  }
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><path d="M9.5 9.5h5M12 7v5"/></svg>
      </div>
      <div class="bt"><b>แผนที่ใบรับรองแพทย์<span class="demo">DEMO</span></b><span>MOPH Certificate · Map V.1</span></div>
      <div class="hright mob-only"></div>
      <button id="loginBtn" class="btn pri" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        Health ID
      </button>
      <span class="user" id="userTag">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        ผู้ใช้ทดลอง
      </span>
    </div>
    <div class="srow">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F6264" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="sr">ค้นหาสถานพยาบาลหรือวัตถุประสงค์</span>
        <input id="q" type="search" autocomplete="off" placeholder="ชื่อ รพ. หรือ เช่น “ต่อใบขับขี่”">
        <button id="qClear" class="icon-btn" type="button" aria-label="ล้างคำค้นหา" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F6264" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </label>
      <button id="filterBtn" class="btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span id="filterLabel">ตัวกรอง</span>
      </button>
    </div>
    <div class="intent" id="intent" role="status">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="margin-top:3px"><path d="M9 18l6-6-6-6"/></svg>
      <span id="intentText"></span>
    </div>
    <div class="chips" id="suggest" aria-label="ค้นหาด่วนตามวัตถุประสงค์"></div>
  </div>
</header>

<main id="main">
  <div id="map" aria-label="แผนที่สถานพยาบาล"></div>

  <button id="hereBtn" class="float here" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/></svg>
    ค้นหาในบริเวณนี้
  </button>

  <div class="float ctrls">
    <button id="legendBtn" class="fab sq" type="button" aria-label="สัญลักษณ์หมุด" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    </button>
    <button id="nearBtn" class="fab" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      ค้นหาใกล้ฉัน
    </button>
  </div>
  <div class="float legend" id="legend" role="region" aria-label="คำอธิบายสัญลักษณ์"></div>

  <section class="panel" aria-label="ผลการค้นหา">
    <button class="handle" id="handle" type="button" aria-label="ขยายหรือย่อรายการ"><span></span></button>
    <div class="pbody" id="pbody"></div>
  </section>
</main>

<!-- Filter modal -->
<div class="modal" id="filterModal" role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <div class="scrim" data-close></div>
  <div class="dlg">
    <div class="dhead"><b id="fTitle">ตัวกรอง</b>
      <button class="closeb" type="button" data-close aria-label="ปิดตัวกรอง"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="dbody">
      <div class="sec"><b>ประเภทใบรับรองที่ต้องการ</b><div class="opts" id="fCert"></div></div>
      <div class="sec"><b>สถานะเปิด–ปิด <span class="hint">(อ้างอิงวัน–เวลาทำการ)</span></b><div class="grid3" id="fOpen"></div></div>
      <div class="sec"><b>ระดับสถานพยาบาล</b><div class="opts" id="fLevel"></div></div>
      <label class="chk"><input type="checkbox" id="fInactive" checked> แสดงสถานพยาบาลที่ยัง Inactive</label>
      <div class="sec"><b>เวลาที่ใช้คำนวณเปิด–ปิด <span class="hint">(สำหรับสาธิต)</span></b><div class="grid3" id="fTime" style="grid-template-columns:repeat(2,minmax(0,1fr))"></div></div>
    </div>
    <div class="dfoot">
      <button class="btn" type="button" id="fReset">ล้างตัวกรอง</button>
      <button class="btn pri" type="button" data-close id="fApply">ดูผลลัพธ์</button>
    </div>
  </div>
</div>

<!-- Auth modal (Health ID → consent) -->
<div class="modal" id="authModal" role="dialog" aria-modal="true" aria-labelledby="aTitle">
  <div class="scrim" data-aclose></div>
  <div class="dlg">
    <div class="dhead"><b id="aTitle">เข้าสู่ระบบ</b>
      <button class="closeb" type="button" data-aclose aria-label="ปิด"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="dbody" id="authBody"></div>
    <div class="dfoot" id="authFoot"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  /* ================= DATA (ตัวอย่างเพื่อการสาธิต) ================= */
  const LV = {
    A: { name: 'โรงพยาบาลศูนย์', l: 'ศ', c: '#6A1B9A' },
    S: { name: 'โรงพยาบาลทั่วไป', l: 'ท', c: '#1F5FBF' },
    M: { name: 'โรงพยาบาลชุมชน', l: 'ช', c: '#0E7A4F' },
    P: { name: 'รพ.สต.', l: 'สต', c: '#7A4E14' },
    H: { name: 'โรงพยาบาลเอกชน', l: 'อ', c: '#C2410C' },
    C: { name: 'คลินิกเอกชน', l: 'ค', c: '#AD1457' }
  };
  const CERT = { drive: 'ใบอนุญาตขับรถ', job: 'สมัครงาน', general: 'ทั่วไป (5 โรค)', sick: 'ลาป่วย', foreign: 'แรงงานต่างด้าว', study: 'ศึกษาต่อ' };
  const INTENTS = [
    { cert: 'drive', words: ['ต่อใบขับขี่', 'ใบขับขี่', 'ทำใบขับขี่', 'ขับรถ', 'ขับขี่', 'กรมขนส่ง', 'ใบอนุญาตขับรถ'] },
    { cert: 'job', words: ['สมัครงาน', 'ทำงาน', 'เข้างาน'] },
    { cert: 'sick', words: ['ลาป่วย', 'ป่วย', 'ลางาน'] },
    { cert: 'foreign', words: ['ต่างด้าว', 'แรงงาน', 'ใบอนุญาตทำงาน', 'work permit'] },
    { cert: 'study', words: ['เรียนต่อ', 'สมัครเรียน', 'ศึกษาต่อ', 'สอบเข้า'] },
    { cert: 'general', words: ['5 โรค', 'ห้าโรค', 'ทั่วไป', 'ตรวจสุขภาพ'] }
  ];
  const SUGGEST = ['ต่อใบขับขี่', 'สมัครงาน', 'ลาป่วย', 'แรงงานต่างด้าว', 'เรียนต่อ'];
  const ALL = Object.keys(CERT);
  const BASE = { lat: 13.8518, lng: 100.5266 }; // จุดเริ่มต้นจำลอง (ใช้เมื่อไม่อนุญาตตำแหน่ง)

  // [id, name, level, dxKm(E), dyKm(N), certs, weekday hours, weekend hours, active]
  const RAW = [
    ['f1', 'โรงพยาบาลศูนย์ตัวอย่าง', 'A', 1.2, 1.6, ALL, [8, 16], [8, 12], true],
    ['f2', 'โรงพยาบาลทั่วไปตัวอย่าง', 'S', -2.1, -1.4, ['drive', 'job', 'general', 'sick', 'study'], [8, 16], null, true],
    ['f3', 'โรงพยาบาลชุมชนบางตัวอย่าง', 'M', 3.8, -2.6, ['drive', 'job', 'general', 'sick'], [8.5, 16.5], null, true],
    ['f4', 'โรงพยาบาลชุมชนท่าตัวอย่าง', 'M', -4.2, 3.1, ['drive', 'general', 'sick'], [8.5, 16.5], null, false],
    ['f5', 'รพ.สต.บ้านหนึ่ง', 'P', -0.4, -1.9, ['general', 'sick'], [8.5, 16.5], null, true],
    ['f6', 'รพ.สต.บ้านสอง', 'P', 2.4, 0.2, ['general', 'sick', 'job'], [8.5, 16.5], null, true],
    ['f7', 'รพ.สต.บ้านสาม', 'P', -2.6, 0.9, ['general'], [8.5, 16.5], null, false],
    ['f8', 'รพ.สต.บ้านสี่', 'P', 4.6, 2.9, ['general', 'sick'], [8.5, 16.5], null, true],
    ['f9', 'โรงพยาบาลเอกชนตัวอย่าง', 'H', 0.6, 0.7, ['drive', 'job', 'general', 'sick', 'study'], [0, 24], [0, 24], true],
    ['f10', 'โรงพยาบาลเอกชนสอง', 'H', 5.2, -1.0, ['drive', 'job', 'general', 'foreign'], [7, 20], [7, 20], true],
    ['f11', 'คลินิกเวชกรรมหนึ่ง', 'C', -1.1, -0.3, ['drive', 'job', 'general', 'sick'], [17, 20], [9, 12], true],
    ['f12', 'คลินิกเวชกรรมสอง', 'C', 1.4, -1.0, ['drive', 'general', 'sick'], [17, 21], null, false],
    ['f13', 'คลินิกเวชกรรมสาม', 'C', -3.3, -3.0, ['drive', 'job', 'general'], [9, 19], [9, 19], true],
    ['f14', 'โรงพยาบาลทั่วไปสอง', 'S', 3.0, 4.4, ALL, [8, 16], [8, 12], true],
    ['f15', 'คลินิกเวชกรรมสี่', 'C', 0.2, 2.6, ['drive', 'job', 'general', 'foreign'], [8, 20], [8, 20], true],
    ['f16', 'รพ.สต.บ้านห้า', 'P', -5.0, -0.8, ['general', 'sick'], [8.5, 16.5], null, true],
    ['f17', 'โรงพยาบาลเอกชนสาม', 'H', -1.8, 4.8, ['drive', 'job', 'general', 'sick', 'foreign', 'study'], [6, 22], [6, 22], true],
    ['f18', 'คลินิกเวชกรรมห้า', 'C', 2.2, -3.8, ['drive', 'general'], [16, 20], [9, 15], true]
  ];
  let F = [];
  function buildFacilities(origin) {
    F = RAW.map((r, i) => ({
      id: r[0], name: r[1] + ' (ตัวอย่าง)', lv: r[2],
      lat: origin.lat + r[4] / 110.6, lng: origin.lng + r[3] / (111.3 * Math.cos(origin.lat * Math.PI / 180)),
      certs: r[5], wk: r[6], we: r[7], active: r[8],
      addr: '[เลขที่] ถนน[ชื่อถนน] ตำบล[ตำบล] อำเภอ[อำเภอ] จังหวัด[จังหวัด] [รหัสไปรษณีย์]',
      phone: '0' + (2 + (i % 7)) + '-000-' + String(1000 + i * 37).slice(0, 4)
    }));
  }
  buildFacilities(BASE);

  /* ================= STATE ================= */
  const S = {
    q: '', cert: 'all', openF: 'all', levels: new Set(Object.keys(LV)), showInactive: true,
    sel: null, user: { ...BASE }, area: null, timeMode: 'now', logged: false
  };

  /* ================= HELPERS ================= */
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hhmm = (h) => { const H = Math.floor(h), m = Math.round((h - H) * 60); return String(H).padStart(2, '0') + ':' + String(m).padStart(2, '0'); };
  const range = (r) => !r ? 'ปิด' : (r[0] === 0 && r[1] === 24 ? 'เปิด 24 ชั่วโมง' : hhmm(r[0]) + '–' + hhmm(r[1]) + ' น.');
  const DAYS = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
  function now() {
    if (S.timeMode === 'demo') return { day: 5, hour: 10.5 };
    const d = new Date(Date.now() + 7 * 3600e3); // Asia/Bangkok
    return { day: d.getUTCDay(), hour: d.getUTCHours() + d.getUTCMinutes() / 60 };
  }
  const hoursFor = (f, t) => (t.day === 0 || t.day === 6) ? f.we : f.wk;
  const isOpen = (f) => { const t = now(), r = hoursFor(f, t); return !!r && t.hour >= r[0] && t.hour < r[1]; };
  function openText(f) {
    const t = now(), r = hoursFor(f, t);
    if (isOpen(f)) return r[0] === 0 && r[1] === 24 ? 'เปิดอยู่ · 24 ชั่วโมง' : 'เปิดอยู่ · ปิด ' + hhmm(r[1]) + ' น.';
    if (r && t.hour < r[0]) return 'ปิดอยู่ · เปิด ' + hhmm(r[0]) + ' น.';
    return 'ปิดแล้ววันนี้';
  }
  function distKm(a, b) {
    const R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  const fmtDist = (km) => km < 1 ? Math.round(km * 100) * 10 + ' ม.' : km.toFixed(1) + ' กม.';
  const lvChip = (k, cls = '', inactive = false) => `<span class="lv ${cls} ${inactive ? 'inact' : ''}" style="${inactive ? 'color' : 'background'}:${LV[k].c}">${LV[k].l}</span>`;
  let tTimer;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tTimer); tTimer = setTimeout(() => t.classList.remove('show'), 2600); }
  const isDesktop = () => window.matchMedia('(min-width: 900px)').matches;

  function intentOf(q) {
    if (!q) return null;
    const ql = q.toLowerCase();
    return INTENTS.find((it) => it.words.some((w) => ql.includes(w) || (ql.length >= 3 && w.includes(ql)))) || null;
  }

  /* ================= MAP ================= */
  const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([BASE.lat, BASE.lng], 13);
  map.zoomControl.setPosition('topright');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors · แผนที่สาธิต'
  }).addTo(map);
  const pinLayer = L.layerGroup().addTo(map);
  const meMarker = L.marker([BASE.lat, BASE.lng], { icon: L.divIcon({ className: 'pin-wrap', html: '<div class="me"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }), interactive: false, zIndexOffset: 1000 }).addTo(map);

  let prog = false;
  function progMove(fn) { prog = true; fn(); clearTimeout(progMove.t); progMove.t = setTimeout(() => { prog = false; }, 700); }
  map.on('moveend', () => { if (!prog && !S.sel) $('hereBtn').classList.add('show'); });
  map.whenReady(() => { S.area = map.getBounds(); render(); });

  function offsetCenter(latlng) {
    // ให้หมุดที่เลือกอยู่เหนือ bottom sheet บนมือถือ
    if (isDesktop()) return latlng;
    const sheet = $('main').clientHeight * 0.62;
    const p = map.project(latlng, map.getZoom()).add([0, sheet / 2 - 20]);
    return map.unproject(p, map.getZoom());
  }

  /* ================= FILTERING ================= */
  function compute() {
    const q = S.q.trim();
    const intent = intentOf(q);
    const nameQ = q && !intent ? q : '';
    const cert = intent ? intent.cert : S.cert;
    const res = F.filter((f) =>
      S.levels.has(f.lv) &&
      (S.showInactive || f.active) &&
      (cert === 'all' || f.certs.includes(cert)) &&
      (S.openF === 'all' || (S.openF === 'open' ? isOpen(f) : !isOpen(f))) &&
      (!nameQ || f.name.includes(nameQ) || LV[f.lv].name.includes(nameQ)) &&
      (nameQ || !S.area || S.area.contains([f.lat, f.lng]))
    ).map((f) => ({ ...f, km: distKm(S.user, f) })).sort((a, b) => a.km - b.km);
    return { q, intent, nameQ, cert, res };
  }
  function filterCount(cert) {
    return (cert !== 'all' ? 1 : 0) + (S.openF !== 'all' ? 1 : 0) + (S.levels.size < 6 ? 1 : 0) + (S.showInactive ? 0 : 1);
  }

  /* ================= RENDER ================= */
  function render() {
    const C = compute();

    // header
    $('qClear').hidden = !C.q;
    $('intent').classList.toggle('show', !!C.intent);
    if (C.intent) $('intentText').innerHTML = `ค้นหาจาก “${esc(C.q)}” → แสดงสถานพยาบาลที่ออก <b>ใบรับรองแพทย์สำหรับ${CERT[C.intent.cert]}</b> ได้`;
    $('suggest').style.display = C.q ? 'none' : 'flex';
    const n = filterCount(C.cert);
    $('filterLabel').textContent = n ? `ตัวกรอง (${n})` : 'ตัวกรอง';
    $('filterBtn').classList.toggle('on', !!n);
    $('fApply').textContent = `ดูผลลัพธ์ (${C.res.length} แห่ง)`;

    // pins
    pinLayer.clearLayers();
    C.res.forEach((f) => {
      const L0 = LV[f.lv], open = isOpen(f), sel = S.sel === f.id;
      const html = `<div class="pin ${f.active ? '' : 'inact'} ${sel ? 'sel' : ''}" style="color:${L0.c}">
        <div class="c" style="background:${L0.c}">${L0.l}<span class="d" style="background:${open ? '#16A34A' : '#4B5563'}"></span></div>
        <div class="s" style="background:${L0.c}"></div></div>`;
      L.marker([f.lat, f.lng], {
        icon: L.divIcon({ className: 'pin-wrap', html, iconSize: [36, 46], iconAnchor: [18, 46] }),
        title: `${f.name} · ${L0.name}${f.active ? '' : ' · Inactive'} · ${openText(f)}`,
        alt: f.name, keyboard: true, zIndexOffset: sel ? 900 : 0, riseOnHover: true
      }).on('click', () => select(f.id)).addTo(pinLayer);
    });

    // panel
    const main = $('main');
    main.classList.toggle('detail', !!S.sel);
    if (S.sel) main.classList.remove('expanded');
    $('pbody').innerHTML = S.sel ? detailHTML(C) : listHTML(C);
    bindPanel();
  }

  function listHTML(C) {
    const t = now();
    const nearUser = S.area && S.area.contains([S.user.lat, S.user.lng]);
    const title = C.nameQ ? `ผลการค้นหา “${esc(C.nameQ)}” · ${C.res.length} แห่ง` : `${nearUser ? 'ใกล้คุณ' : 'ในบริเวณนี้'} · ${C.res.length} แห่ง`;
    const clock = `เปิด–ปิดอิงเวลา ${DAYS[t.day]} ${hhmm(t.hour)} น.${S.timeMode === 'demo' ? ' (จำลอง)' : ''}`;
    let h = `<div class="rhead"><b>${title}</b><span>${clock}</span></div>`;
    if (!C.res.length) h += `<div class="empty">ไม่พบสถานพยาบาลตามเงื่อนไขในบริเวณนี้ ลองล้างตัวกรอง ซูมออก หรือเลื่อนแผนที่แล้วกด “ค้นหาในบริเวณนี้”</div>`;
    h += C.res.map((f) => {
      const open = isOpen(f);
      return `<button class="item" type="button" data-sel="${f.id}">
        ${lvChip(f.lv, '', !f.active)}
        <span class="itxt"><b>${esc(f.name)}</b><span>${LV[f.lv].name}${f.active ? '' : ' · Inactive'}</span></span>
        <span class="iside"><b>${fmtDist(f.km)}</b><span class="tag ${open ? 't-open' : 't-closed'}">${open ? 'เปิดอยู่' : 'ปิด'}</span></span>
      </button>`;
    }).join('');
    return h;
  }

  function detailHTML(C) {
    const f = F.find((x) => x.id === S.sel);
    if (!f) return '';
    const L0 = LV[f.lv], open = isOpen(f), km = distKm(S.user, f);
    return `
      <div class="dtop">
        ${lvChip(f.lv, 'lg', !f.active)}
        <div style="flex:1;min-width:0">
          <h2>${esc(f.name)}</h2>
          <div class="tags">
            <span class="tag" style="background:#F0F3F2;color:${L0.c}">${L0.name}</span>
            <span class="tag ${f.active ? 't-act' : 't-inact'}">${f.active ? 'Active · ออกใบรับรองดิจิทัลได้' : 'Inactive · ยังไม่ให้บริการ'}</span>
            <span style="font-size:12px;color:var(--muted)">${fmtDist(km)} จากคุณ</span>
          </div>
        </div>
        <button class="closeb" type="button" id="dClose" aria-label="ปิดรายละเอียด"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="obox" style="${open ? 'background:var(--ok-bg);color:var(--ok)' : 'background:#F0F3F2;color:var(--off)'}">
        <b>${openText(f)}</b>
        <span>จันทร์–ศุกร์ ${range(f.wk)}<br>เสาร์–อาทิตย์ ${range(f.we)}</span>
      </div>
      <div class="sec"><b>ใบรับรองแพทย์ที่ออกได้</b>
        <div class="cwrap">${f.certs.map((c) => `<span class="cert ${c === C.cert ? 'hit' : ''}">${CERT[c]}</span>`).join('')}</div>
      </div>
      <div class="row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F6264" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top:3px"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span>${esc(f.addr)}</span>
      </div>
      <a class="call" href="tel:${f.phone.replace(/-/g, '')}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
        <span>${f.phone}</span><b>โทรเลย</b>
      </a>
      <div class="acts">
        <button class="btn out" type="button" id="dShare">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
          แชร์โลเคชัน
        </button>
        <a class="btn pri" id="dNav" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${f.lat.toFixed(6)},${f.lng.toFixed(6)}" style="text-decoration:none;flex:1.4">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>
          นำทาง
        </a>
      </div>`;
  }

  function bindPanel() {
    document.querySelectorAll('[data-sel]').forEach((b) => b.addEventListener('click', () => select(b.dataset.sel)));
    const c = $('dClose'); if (c) c.addEventListener('click', () => { S.sel = null; render(); });
    const sh = $('dShare'); if (sh) sh.addEventListener('click', shareSel);
  }

  function select(id) {
    S.sel = id;
    $('hereBtn').classList.remove('show');
    $('legend').classList.remove('show');
    render();
    const f = F.find((x) => x.id === id);
    progMove(() => map.panTo(offsetCenter(L.latLng(f.lat, f.lng)), { animate: true }));
  }

  async function shareSel() {
    const f = F.find((x) => x.id === S.sel);
    const url = `https://www.google.com/maps/search/?api=1&query=${f.lat.toFixed(6)},${f.lng.toFixed(6)}`;
    const data = { title: f.name, text: `${f.name}\n${LV[f.lv].name} · โทร ${f.phone}`, url };
    try {
      if (navigator.share) { await navigator.share(data); return; }
      await navigator.clipboard.writeText(`${data.text}\n${url}`);
      toast('คัดลอกลิงก์ตำแหน่งแล้ว');
    } catch (e) { if (e && e.name !== 'AbortError') toast('แชร์ไม่สำเร็จ ลองอีกครั้ง'); }
  }

  /* ================= HEADER / CONTROLS ================= */
  $('suggest').innerHTML = SUGGEST.map((w) => `<button class="chip" type="button" data-q="${w}">${w}</button>`).join('');
  $('suggest').addEventListener('click', (e) => { const b = e.target.closest('[data-q]'); if (!b) return; $('q').value = b.dataset.q; S.q = b.dataset.q; S.sel = null; render(); });
  $('q').addEventListener('input', (e) => { S.q = e.target.value; S.sel = null; render(); });
  $('qClear').addEventListener('click', () => { $('q').value = ''; S.q = ''; S.sel = null; render(); $('q').focus(); });

  $('hereBtn').addEventListener('click', () => {
    S.area = map.getBounds(); S.sel = null;
    if (S.q && !intentOf(S.q.trim())) { S.q = ''; $('q').value = ''; }
    $('hereBtn').classList.remove('show'); render();
  });

  $('nearBtn').addEventListener('click', () => {
    const go = (pos, real) => {
      S.user = pos; meMarker.setLatLng([pos.lat, pos.lng]);
      if (real && distKm(pos, F[0]) > 30) { buildFacilities(pos); toast('ข้อมูลสาธิตถูกจัดวางรอบตำแหน่งของคุณ'); }
      S.sel = null;
      if (S.q && !intentOf(S.q.trim())) { S.q = ''; $('q').value = ''; }
      progMove(() => map.setView([pos.lat, pos.lng], 14));
      setTimeout(() => { S.area = map.getBounds(); $('hereBtn').classList.remove('show'); render(); }, 350);
    };
    if (!navigator.geolocation) { go({ ...BASE }, false); toast('อุปกรณ์ไม่รองรับการระบุตำแหน่ง ใช้ตำแหน่งจำลอง'); return; }
    toast('กำลังระบุตำแหน่งของคุณ…');
    navigator.geolocation.getCurrentPosition(
      (p) => go({ lat: p.coords.latitude, lng: p.coords.longitude }, true),
      () => { go({ ...BASE }, false); toast('ไม่ได้รับอนุญาตตำแหน่ง ใช้ตำแหน่งจำลองแทน'); },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
  });

  $('legend').innerHTML = `<b>ระดับสถานพยาบาล</b>` +
    Object.keys(LV).map((k) => `<span class="li">${lvChip(k, 'sm')}${LV[k].name}</span>`).join('') +
    `<span class="hr"></span>
     <span class="li"><span style="width:22px;height:22px;border-radius:50%;border:2px dashed #4F6264"></span>Inactive (ยังไม่ให้บริการ)</span>
     <span class="li"><span style="width:10px;height:10px;border-radius:50%;background:#16A34A;margin:0 6px"></span>เปิดอยู่ตอนนี้</span>
     <span class="li"><span style="width:10px;height:10px;border-radius:50%;background:#4B5563;margin:0 6px"></span>ปิดแล้ว (ตามเวลาทำการ)</span>`;
  $('legendBtn').addEventListener('click', () => {
    const on = $('legend').classList.toggle('show');
    $('legendBtn').setAttribute('aria-expanded', on);
  });

  $('handle').addEventListener('click', () => { if (!S.sel) $('main').classList.toggle('expanded'); });

  /* ================= FILTER MODAL ================= */
  function renderFilters() {
    const C = compute();
    $('fCert').innerHTML = [['all', 'ทุกประเภท'], ...Object.entries(CERT)].map(([k, v]) =>
      `<button class="opt" type="button" data-cert="${k}" aria-pressed="${C.cert === k}">${v}</button>`).join('');
    $('fOpen').innerHTML = [['all', 'ทั้งหมด'], ['open', 'เปิดอยู่'], ['closed', 'ปิดอยู่']].map(([k, v]) =>
      `<button class="opt" type="button" data-open="${k}" aria-pressed="${S.openF === k}">${v}</button>`).join('');
    $('fLevel').innerHTML = Object.keys(LV).map((k) =>
      `<button class="opt lvopt" type="button" data-lv="${k}" aria-pressed="${S.levels.has(k)}">${lvChip(k, 'sm')}${LV[k].name}</button>`).join('');
    $('fTime').innerHTML = [['now', 'เวลาปัจจุบัน'], ['demo', 'จำลอง ศ. 10:30 น.']].map(([k, v]) =>
      `<button class="opt" type="button" data-time="${k}" aria-pressed="${S.timeMode === k}">${v}</button>`).join('');
    $('fInactive').checked = S.showInactive;
  }
  function openModal(id) { $(id).classList.add('show'); }
  function closeModal(id) { $(id).classList.remove('show'); }
  $('filterBtn').addEventListener('click', () => { renderFilters(); openModal('filterModal'); });
  $('filterModal').addEventListener('click', (e) => {
    const t = e.target.closest('button,[data-close]');
    if (!t) return;
    if (t.hasAttribute('data-close')) { closeModal('filterModal'); return; }
    const clearIntent = () => { if (intentOf(S.q.trim())) { S.q = ''; $('q').value = ''; } };
    if (t.dataset.cert) { clearIntent(); S.cert = t.dataset.cert; }
    else if (t.dataset.open) S.openF = t.dataset.open;
    else if (t.dataset.lv) { const k = t.dataset.lv; S.levels.has(k) ? S.levels.delete(k) : S.levels.add(k); }
    else if (t.dataset.time) S.timeMode = t.dataset.time;
    else if (t.id === 'fReset') { clearIntent(); S.cert = 'all'; S.openF = 'all'; S.levels = new Set(Object.keys(LV)); S.showInactive = true; }
    else return;
    S.sel = null; render(); renderFilters();
  });
  $('fInactive').addEventListener('change', (e) => { S.showInactive = e.target.checked; S.sel = null; render(); renderFilters(); });

  /* ================= AUTH (Health ID mock) ================= */
  const ICON = {
    doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h4"/>',
    cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    share: '<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/>',
    shield: '<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/>'
  };
  const ic = (k, c = '#0B6E69') => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top:2px">${ICON[k]}</svg>`;

  function authStep(step) {
    const body = $('authBody'), foot = $('authFoot'), title = $('aTitle');
    if (step === 'login') {
      title.textContent = 'เข้าสู่ระบบ';
      body.innerHTML = `<div class="auth" style="display:flex;flex-direction:column;gap:18px">
        <h1>เข้าสู่ระบบด้วย Health ID</h1>
        <p>ดูแผนที่และค้นหาสถานพยาบาลได้โดยไม่ต้องเข้าสู่ระบบ เข้าสู่ระบบเมื่อต้องการใช้บริการส่วนตัว</p>
        <div class="benefit">${ic('doc')}ดูใบรับรองแพทย์ของฉัน</div>
        <div class="benefit">${ic('cal')}จองคิวตรวจเพื่อออกใบรับรอง</div>
        <div class="benefit">${ic('share')}แชร์ใบรับรองให้หน่วยงานปลายทาง เช่น กรมการขนส่งทางบก</div>
        <div class="note">${ic('shield', '#4F6264')}<span>หลังยืนยันตัวตน ระบบจะขอความยินยอมการใช้ข้อมูลส่วนบุคคลก่อนแสดงข้อมูลรายบุคคล</span></div>
      </div>`;
      foot.innerHTML = `<button class="btn" type="button" data-aclose>ดูแผนที่ต่อ</button><button class="btn pri" type="button" id="aGo">เข้าสู่ระบบด้วย Health ID</button>`;
      $('aGo').onclick = () => authStep('wait');
    } else if (step === 'wait') {
      title.textContent = 'Health ID';
      body.innerHTML = `<div class="auth" style="display:flex;flex-direction:column;gap:16px;align-items:center;padding:24px 0;text-align:center">
        <div class="spin"></div><p>กำลังเชื่อมต่อ Health ID เพื่อยืนยันตัวตน…<br><span class="hint">(จำลองสำหรับสาธิต)</span></p></div>`;
      foot.innerHTML = '';
      setTimeout(() => authStep('consent'), 1400);
    } else if (step === 'consent') {
      title.textContent = 'ความยินยอมการใช้ข้อมูล';
      body.innerHTML = `<div class="auth" style="display:flex;flex-direction:column;gap:14px">
        <div class="note" style="background:var(--ok-bg);color:var(--ok)">ยืนยันตัวตนผ่าน Health ID แล้ว · ผู้ใช้ทดลอง</div>
        <p>เลือกยินยอมแยกได้ตามวัตถุประสงค์ และถอนความยินยอมได้ทุกเมื่อที่หน้าโปรไฟล์</p>
        <label class="cons req"><input type="checkbox" checked disabled><span><b>ดูใบรับรองแพทย์ของฉัน (จำเป็น)</b><span>เลขประจำตัวประชาชน ชื่อ และใบรับรองที่ออกในนามคุณ</span></span></label>
        <label class="cons"><input type="checkbox" checked><span><b>ใช้ตำแหน่งปัจจุบัน</b><span>เพื่อแสดงสถานพยาบาลใกล้คุณ ไม่บันทึกประวัติตำแหน่ง</span></span></label>
        <label class="cons"><input type="checkbox"><span><b>รับการแจ้งเตือน</b><span>เมื่อใบรับรองออกแล้ว ใกล้หมดอายุ หรือมีนัดหมาย</span></span></label>
        <label class="cons"><input type="checkbox"><span><b>แชร์ใบรับรองให้หน่วยงานปลายทาง</b><span>ระบบจะถามยืนยันอีกครั้งทุกครั้งที่แชร์</span></span></label>
        <p style="font-size:12px">ระยะเวลาเก็บข้อมูล: [ระบุตามนโยบาย สป.] · ผู้ควบคุมข้อมูล: [ระบุ] · <a href="#" onclick="return false">นโยบายความเป็นส่วนตัว</a></p>
      </div>`;
      foot.innerHTML = `<button class="btn" type="button" data-aclose>ไม่ยินยอม</button><button class="btn pri" type="button" id="aOk">ยินยอมและดำเนินการต่อ</button>`;
      $('aOk').onclick = () => { S.logged = true; document.body.classList.add('logged'); closeModal('authModal'); toast('เข้าสู่ระบบด้วย Health ID แล้ว (สาธิต)'); };
    }
  }
  $('loginBtn').addEventListener('click', () => { authStep('login'); openModal('authModal'); });
  $('authModal').addEventListener('click', (e) => { if (e.target.closest('[data-aclose]')) closeModal('authModal'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal('filterModal'); closeModal('authModal'); } });

  // refresh open/closed every minute
  setInterval(() => { if (S.timeMode === 'now') render(); }, 60000);
  window.addEventListener('resize', () => map.invalidateSize());
  if ('serviceWorker' in navigator && location.pathname.startsWith('/demos/moph-cert-map/')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/demos/moph-cert-map/sw.js', { scope: '/demos/moph-cert-map/' }).catch(() => {}));
  }
})();
</script>
</body>
</html>
